.wheel-assembly{

.wheel-outer{

  cursor:grab;

.wheel-outer:active{ cursor:grabbing; }

.wheel{

  width: 86%;
  height: 86%;
  border-radius:50%;
  transform: rotate(var(--wheel-rot));

const Sfx = {
  ctx: null,
  ensure(){
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  blip(freq, durMs, type, gain){
    let ctx;
    try { ctx = this.ensure(); } catch(err) { return; }
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, now + durMs / 1000);
    osc.connect(g).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + durMs / 1000 + 0.02);
  },
  tick(){ this.blip(1500, 10, 'square', 0.045); },   // wheel scroll detent

  { title:'Email', sub:'aaron.phan240@gmail.com', href:'mailto:aaron.phan240@gmail.com', ext:false },
  { title:'GitHub', sub:'github.com/aa-phan', href:'https://github.com/aa-phan', ext:true },
  { title:'LinkedIn', sub:'linkedin.com/in/aa-phan', href:'https://www.linkedin.com/in/aa-phan/', ext:true },
  { title:'DJ Instagram', sub:'instagram.com/phvntm_', href:'https://www.instagram.com/phvntm_', ext:true },

];

// ===== escape helper =====
function escText(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== frame builders =====
function activateContact(entry){
  if (entry.ext){
    window.open(entry.href, '_blank', 'noopener');
  } else {
    location.href = entry.href;
  }
}

function makeEntryDetailFrame(sectionTitle, entry){
  return { type:'body', title: entry.title, render: (container) => {
    if (entry.sub){
      const sub = document.createElement('p');
      sub.className = 'detail-sub';
      sub.textContent = entry.sub;
      container.appendChild(sub);
    }
    if (entry.body){
      entry.body.forEach(line => {
        const p = document.createElement('p');
        p.textContent = line;
        container.appendChild(p);
      });
    }
    if (entry.kv){
      const kv = document.createElement('div');
      kv.className = 'kv';
      entry.kv.forEach(pair => {
        const row = document.createElement('div');
        row.className = 'kv-row';
        const k = document.createElement('span');
        k.className = 'kv-key';
        k.textContent = pair[0];
        const v = document.createElement('span');
        v.textContent = pair[1];
        row.appendChild(k); row.appendChild(v);
        kv.appendChild(row);
      });
      container.appendChild(kv);
    }
    if (entry.stack){
      const sl = document.createElement('div');
      sl.className = 'stackline';
      sl.textContent = 'STACK: ' + entry.stack.join(' · ');
      container.appendChild(sl);
    }
    if (entry.link){
      const a = document.createElement('a');
      a.href = entry.link.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'detail-link';
      a.textContent = entry.link.label + ' ↗';
      container.appendChild(a);
    }
  }};
}

function makeSectionListFrame(title, items){
  return { type:'list', title:title, selectedIndex:0,
    items: items.map(entry => ({
      label: entry.title,
      sub: entry.sub,
      chevron: true,
      select: () => makeEntryDetailFrame(title, entry)
    }))
  };
}

function makeContactFrame(){
  return { type:'list', title:'Contact Me', selectedIndex:0,
    items: CONTACT.map(entry => ({
      label: entry.title,
      sub: entry.sub,
      chevron: false,
      select: () => { activateContact(entry); return null; }
    }))
  };
}

function makeAboutFrame(){
  return { type:'body', title:'About Me', render: (container) => {
    ABOUT.bio.forEach(p => {
      const el = document.createElement('p');
      el.textContent = p;
      container.appendChild(el);
    });
    const bq = document.createElement('blockquote');
    bq.textContent = ABOUT.quote;
    container.appendChild(bq);
  }};
}

function makeSkillsFrame(){
  return { type:'body', title:'Skills', render: (container) => {
    SKILLS.forEach((cat, i) => {
      const sk = document.createElement('div');
      sk.className = 'skillsline' + (i === 0 ? ' skillsline-first' : '');
      const b = document.createElement('b');
      b.textContent = cat.label.toUpperCase();
      sk.appendChild(b);
      sk.appendChild(document.createTextNode(cat.items));
      container.appendChild(sk);
    });
  }};
}

function makeHomeFrame(){
  return { type:'list', title:'Aaron Phan', selectedIndex:0,
    items:[
      { label:'About Me', sub:null, chevron:true, select: () => makeAboutFrame() },
      { label:'Skills', sub:null, chevron:true, select: () => makeSkillsFrame() },
      { label:'Education', sub:null, chevron:true, select: () => makeSectionListFrame('Education', EDUCATION) },
      { label:'Experience', sub:null, chevron:true, select: () => makeSectionListFrame('Experience', EXPERIENCE) },
      { label:'Projects', sub:null, chevron:true, select: () => makeSectionListFrame('Projects', PROJECTS) },
      { label:'Contact Me', sub:null, chevron:true, select: () => makeContactFrame() }
    ]
  };
}

// ===== nav stack =====
const navStack = [ makeHomeFrame() ];

function currentFrame(){ return navStack[navStack.length - 1]; }

function pushFrame(frame){
  if (frame){
    navStack.push(frame);
    render();
  }
}

function popFrame(){
  if (navStack.length > 1){
    Sfx.click();
    navStack.pop();
    render();
  }
}

function selectCurrent(){
  const frame = currentFrame();
  if (frame.type !== 'list') return;
  const item = frame.items[frame.selectedIndex];
  if (!item) return;
  Sfx.click();
  const next = item.select();
  if (next) pushFrame(next);
}

// ===== DOM refs =====
const screenTitleEl = document.getElementById('screenTitle');
const paneEl = document.getElementById('pane');
const wheelOuter = document.getElementById('wheelOuter');
const wheelEl = document.getElementById('wheel');
const menuBtn = document.getElementById('menuBtn');
const selectBtn = document.getElementById('selectBtn');
const backBtn = document.getElementById('backBtn');

function render(){
  const frame = currentFrame();
  screenTitleEl.textContent = frame.title;
  paneEl.scrollTop = 0;
  paneEl.innerHTML = '';

  if (frame.type === 'list'){
    const ul = document.createElement('ul');
    ul.className = 'ilist';
    ul.setAttribute('role', 'listbox');
    frame.items.forEach((item, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'irow';
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', i === frame.selectedIndex ? 'true' : 'false');
      let html = '<span class="irow-main"><span class="irow-label">' + escText(item.label) + '</span>';
      if (item.sub) html += '<span class="irow-sub">' + escText(item.sub) + '</span>';
      html += '</span>';
      html += '<span class="irow-chevron">' + (item.chevron ? '›' : '') + '</span>';
      btn.innerHTML = html;
      btn.addEventListener('click', () => {
        frame.selectedIndex = i;
        selectCurrent();
      });
      li.appendChild(btn);
      ul.appendChild(li);
    });
    paneEl.appendChild(ul);
    const selectedBtn = ul.children[frame.selectedIndex] && ul.children[frame.selectedIndex].firstElementChild;
    if (selectedBtn) selectedBtn.scrollIntoView({ block:'nearest' });
  } else if (frame.type === 'body'){
    const wrap = document.createElement('div');
    wrap.className = 'body';
    frame.render(wrap);
    paneEl.appendChild(wrap);
  }

  menuBtn.disabled = navStack.length <= 1;
  menuBtn.style.opacity = navStack.length <= 1 ? '0.4' : '1';
  backBtn.disabled = navStack.length <= 1;
}

menuBtn.addEventListener('click', popFrame);
selectBtn.addEventListener('click', selectCurrent);
backBtn.addEventListener('click', popFrame);

// ===== keyboard =====
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;

  const frame = currentFrame();

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    if (frame.type === 'list'){
      const prev = frame.selectedIndex;
      frame.selectedIndex = Math.max(0, Math.min(frame.items.length - 1, frame.selectedIndex + dir));
      if (frame.selectedIndex !== prev) Sfx.tick();
      render();
    } else if (frame.type === 'body'){
      paneEl.scrollTop += dir * 40;
      Sfx.tick();
    }
    return;
  }

  if (e.key === 'Enter'){
    e.preventDefault();
    selectCurrent();
    return;
  }

  if (e.key === 'Escape'){
    e.preventDefault();
    popFrame();
    return;
  }
});

// ===== scroll wheel drag =====
let dragging = false;
let dragStartAngle = 0;
let accumRot = 0;
let cssRot = 0;

function wheelCenter(){
  const r = wheelOuter.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function angleAt(x, y){
  const c = wheelCenter();
  return Math.atan2(y - c.y, x - c.x);
}

wheelOuter.addEventListener('pointerdown', (e) => {
  dragging = true;
  wheelOuter.setPointerCapture(e.pointerId);
  dragStartAngle = angleAt(e.clientX, e.clientY);
});

wheelOuter.addEventListener('pointermove', (e) => {
  if (!dragging) return;

  const angle = angleAt(e.clientX, e.clientY);
  let d = angle - dragStartAngle;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  dragStartAngle = angle;

  cssRot += d * (180 / Math.PI);
  wheelEl.style.setProperty('--wheel-rot', cssRot + 'deg');

  const frame = currentFrame();
  accumRot += d * (180 / Math.PI);
  const THRESH = 34;

  if (frame.type === 'list'){
    if (accumRot >= THRESH){
      accumRot = 0;
      const prev = frame.selectedIndex;
      frame.selectedIndex = Math.min(frame.items.length - 1, frame.selectedIndex + 1);
      if (frame.selectedIndex !== prev) Sfx.tick();
      render();
    } else if (accumRot <= -THRESH){
      accumRot = 0;
      const prev = frame.selectedIndex;
      frame.selectedIndex = Math.max(0, frame.selectedIndex - 1);
      if (frame.selectedIndex !== prev) Sfx.tick();
      render();
    }
  } else if (frame.type === 'body'){
    if (Math.abs(accumRot) >= THRESH){
      const steps = Math.trunc(accumRot / THRESH);
      accumRot -= steps * THRESH;
      paneEl.scrollTop += steps * 46;
      Sfx.tick();
    }
  }
});

function endDrag(e){
  if (!dragging) return;
  dragging = false;
  accumRot = 0;
  try{ wheelOuter.releasePointerCapture(e.pointerId); }catch(err){}
}
wheelOuter.addEventListener('pointerup', endDrag);
wheelOuter.addEventListener('pointercancel', endDrag);

// ===== init =====
render();

})();
</script>
